name: headless-cms

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-HeadlessCms}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55000}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  initialize:
    build:
      context: .
      dockerfile: src/backend/HeadlessCms.Api/Dockerfile.dev
    command:
      - dotnet
      - run
      - --project
      - src/backend/HeadlessCms.Api/HeadlessCms.Api.csproj
      - --no-launch-profile
      - --
      - --initialize
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__AdminEmail: ${ADMIN_EMAIL:-admin@example.com}
      Auth__AdminPassword: ${ADMIN_PASSWORD:-password}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-HeadlessCms};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - .:/workspace
      - backend_nuget:/root/.nuget/packages
      - backend_api_bin:/workspace/src/backend/HeadlessCms.Api/bin
      - backend_api_obj:/workspace/src/backend/HeadlessCms.Api/obj
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: src/backend/HeadlessCms.Api/Dockerfile.dev
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Frontend__BaseUrl: http://localhost:${FRONTEND_PORT:-3000}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-HeadlessCms};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      ConnectionStrings__Redis: redis:6379
      Caching__Enabled: "true"
      Caching__ExpirationSeconds: ${CACHE_EXPIRATION_SECONDS:-30}
    ports:
      - "127.0.0.1:${API_PORT:-5123}:8080"
    volumes:
      - .:/workspace
      - backend_nuget:/root/.nuget/packages
      - backend_api_bin:/workspace/src/backend/HeadlessCms.Api/bin
      - backend_api_obj:/workspace/src/backend/HeadlessCms.Api/obj
    depends_on:
      initialize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - http://localhost:8080/health/ready
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: src/frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8080
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./src/frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/auth/login
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  backend_nuget:
  backend_api_bin:
  backend_api_obj:
  frontend_node_modules:
  frontend_next_cache:
