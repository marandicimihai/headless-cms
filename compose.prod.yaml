name: headless-cms-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-api-image: &api-image
  image: headless-cms-api:${RELEASE_TAG:?Set a unique RELEASE_TAG}
  build:
    context: .
    dockerfile: src/backend/HeadlessCms.Api/Dockerfile

services:
  initialize:
    <<: *api-image
    command: ["--initialize"]
    restart: "no"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${INITIALIZE_MEMORY_LIMIT:-512m}
    cpus: ${INITIALIZE_CPU_LIMIT:-1.0}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING}
      Auth__AdminEmail: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      Auth__AdminPassword: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
    networks: [data]
    logging: *logging

  api:
    <<: *api-image
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    mem_limit: ${API_MEMORY_LIMIT:-768m}
    cpus: ${API_CPU_LIMIT:-1.0}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DATABASE_CONNECTION_STRING:?Set DATABASE_CONNECTION_STRING}
      Frontend__BaseUrl: https://${APP_DOMAIN:?Set APP_DOMAIN}
      Proxy__KnownProxies__0: ${PROXY_ADDRESS:-172.30.20.2}
    depends_on:
      initialize:
        condition: service_completed_successfully
    networks: [proxy, data]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging

  frontend:
    image: headless-cms-frontend:${RELEASE_TAG:?Set a unique RELEASE_TAG}
    build:
      context: src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-768m}
    cpus: ${FRONTEND_CPU_LIMIT:-1.0}
    environment:
      BACKEND_URL: http://api:8080
      PUBLIC_API_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      api:
        condition: service_healthy
    networks: [proxy]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/auth/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging

  caddy:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./src/deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      proxy:
        ipv4_address: ${PROXY_ADDRESS:-172.30.20.2}
    mem_limit: ${CADDY_MEMORY_LIMIT:-256m}
    cpus: ${CADDY_CPU_LIMIT:-0.5}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

  postgres:
    profiles: [bundled]
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-headless_cms}
      POSTGRES_USER: ${POSTGRES_USER:-headless_cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks: [data]
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *logging

  db-tools:
    profiles: [tools]
    image: postgres:18.3-alpine
    environment:
      PGHOST: ${BACKUP_PGHOST:-postgres}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-headless_cms}
      PGUSER: ${POSTGRES_USER:-headless_cms}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGSSLMODE: ${BACKUP_PGSSLMODE:-prefer}
    networks: [data]
    entrypoint: []
    command: ["pg_dump", "--version"]
    logging: *logging

  load-test:
    profiles: [load-test]
    image: grafana/k6:2.2.0
    environment:
      BASE_URL: http://api:8080
      LOAD_TEST_EMAIL: ${LOAD_TEST_EMAIL:-${ADMIN_EMAIL}}
      LOAD_TEST_PASSWORD: ${LOAD_TEST_PASSWORD:-${ADMIN_PASSWORD}}
      LOAD_TEST_PATH: ${LOAD_TEST_PATH:-}
      LOAD_TEST_VUS: ${LOAD_TEST_VUS:-10}
      LOAD_TEST_DURATION: ${LOAD_TEST_DURATION:-30s}
      LOAD_TEST_WARMUP_REQUESTS: ${LOAD_TEST_WARMUP_REQUESTS:-1}
    volumes:
      - ./load-tests/k6:/scripts:ro
    depends_on:
      api:
        condition: service_healthy
    networks: [data]
    command: ["run", "/scripts/resource-reads.js"]
    restart: "no"
    mem_limit: ${LOAD_TEST_MEMORY_LIMIT:-512m}
    cpus: ${LOAD_TEST_CPU_LIMIT:-1.0}
    logging: *logging

networks:
  proxy:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.30.20.0/24}
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.30.20.128/25}
  data:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
